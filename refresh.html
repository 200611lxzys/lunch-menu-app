<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f7">
  <title>正在修复好好吃饭</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f5f7;color:#1d1d1f;font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.card{max-width:360px;padding:28px;border-radius:24px;background:white;box-shadow:0 8px 30px #00000012;text-align:center}h1{font-size:21px;margin:0 0 10px}p{line-height:1.6;color:#6e6e73;margin:0}.dot{display:inline-block;width:8px;height:8px;margin-right:8px;border-radius:50%;background:#34c759;animation:pulse 1s infinite alternate}@keyframes pulse{to{opacity:.25}}
  </style>
</head>
<body>
  <main class="card">
    <h1><span class="dot"></span>正在刷新好好吃饭</h1>
    <p id="status">正在清理旧网页缓存，菜单历史和设置会保留。</p>
  </main>
  <script>
    (async()=>{
      const root=new URL('./',location.href).href;
      try{
        if('serviceWorker'in navigator){
          const registrations=await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.filter(reg=>reg.scope===root).map(reg=>reg.unregister()));
        }
        if('caches'in window){
          const names=await caches.keys();
          await Promise.all(names.filter(name=>name.startsWith('lunch-menu-')).map(name=>caches.delete(name)));
        }
      }catch(error){}
      location.replace(new URL('./?refresh='+Date.now(),location.href).href);
    })();
  </script>
</body>
</html>
