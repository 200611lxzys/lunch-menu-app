name: Build mobile apps

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - index.html
      - package.json
      - package-lock.json
      - capacitor.config.ts
      - scripts/**
      - android/**
      - ios/**
      - .github/workflows/build-mobile.yml

jobs:
  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: npm install
      - name: Generate Android project if missing
        run: if [ ! -d android ]; then npm run cap:add:android; fi
      - name: Sync app
        run: npm run cap:sync
      - name: Build APK
        run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: haohchifan-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  ios-simulator:
    name: iOS simulator app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Generate iOS project if missing
        run: if [ ! -d ios ]; then npm run cap:add:ios; fi
      - name: Sync app
        run: npm run cap:sync
      - name: Build unsigned simulator app
        run: xcodebuild -workspace ios/App/App.xcworkspace -scheme App -sdk iphonesimulator -configuration Debug -derivedDataPath build CODE_SIGNING_ALLOWED=NO
      - name: Package simulator app
        run: cd build/Build/Products/Debug-iphonesimulator && zip -r "$GITHUB_WORKSPACE/好好吃饭-iOS-Simulator.zip" App.app
      - uses: actions/upload-artifact@v4
        with:
          name: haohchifan-ios-simulator
          path: 好好吃饭-iOS-Simulator.zip
          if-no-files-found: error
